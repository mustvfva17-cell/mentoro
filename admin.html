<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Precepta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<header class="admin-header">
  <a href="/" class="brand">
    <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <rect x="1" y="1" width="30" height="30" rx="9" fill="#345A4B"/>
      <path d="M7 17h4l2.5-6 3 10 2.5-7h6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Precepta <span class="admin-tag">Admin</span>
  </a>
  <button id="logout-btn" class="btn btn-outline" hidden>Log Out</button>
</header>

<main>

  <!-- LOGIN -->
  <section id="login-view" class="admin-login-wrap">
    <div class="form-panel admin-login-panel">
      <span class="eyebrow">Admin access</span>
      <svg class="pulse-fragment" viewBox="0 0 120 24" aria-hidden="true"><path d="M2,12 C12,2 22,2 32,12 C42,22 52,22 62,12 C72,2 82,2 92,12 C102,22 112,22 118,14"/></svg>
      <h1 class="section-title" style="font-size:1.55rem; margin-top:0.75rem;">Sign in to the dashboard</h1>
      <p class="section-subtitle" style="margin-bottom:0;">Authorized team members only.</p>

      <p id="login-boot" class="form-alert form-alert-error" hidden style="margin-top:1.5rem;"></p>

      <form id="login-form" style="margin-top:1.5rem;">
        <div class="form-group">
          <label class="form-label" for="admin-email">Email</label>
          <input class="form-input" type="email" id="admin-email" name="email" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="admin-password">Password</label>
          <input class="form-input" type="password" id="admin-password" name="password" autocomplete="current-password" required>
        </div>

        <div id="login-error" class="form-alert form-alert-error" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><circle cx="12" cy="16.2" r="0.9" fill="currentColor" stroke="none"/></svg>
          <p>We could not sign you in. Check your email and password and try again.</p>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top:1.5rem;">Log In</button>
      </form>
    </div>
  </section>

  <!-- DASHBOARD -->
  <section id="dashboard-view" class="section-sm" hidden>
    <div class="container">

      <div class="admin-tabs">
        <button class="admin-tab is-active" data-tab="students">Student Applications</button>
        <button class="admin-tab" data-tab="physicians">Physician Applications</button>
      </div>

      <div id="tab-students" class="admin-panel">
        <p id="students-status" class="admin-status-msg"></p>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr><th>Name</th><th>Email</th><th>Specialty</th><th>City</th><th>Status</th><th>Submitted</th></tr>
            </thead>
            <tbody id="students-tbody"></tbody>
          </table>
        </div>
      </div>

      <div id="tab-physicians" class="admin-panel" hidden>
        <p id="physicians-status" class="admin-status-msg"></p>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr><th>Name</th><th>Email</th><th>Specialty</th><th>City</th><th>Status</th><th>Submitted</th></tr>
            </thead>
            <tbody id="physicians-tbody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </section>

</main>

<!-- DETAIL MODAL -->
<div id="detail-modal" class="admin-modal" hidden>
  <div class="admin-modal-backdrop" data-close></div>
  <div class="admin-modal-panel" tabindex="-1">
    <button class="admin-modal-close" data-close aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
    </button>
    <span class="eyebrow">Application detail</span>
    <div id="detail-content" style="margin-top:0.75rem;"></div>

    <div id="modal-error" class="form-alert form-alert-error" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><circle cx="12" cy="16.2" r="0.9" fill="currentColor" stroke="none"/></svg>
      <p></p>
    </div>

    <div class="admin-modal-actions">
      <button class="btn btn-outline" data-action="pending">Return to Pending</button>
      <button class="btn btn-danger" data-action="reject">Reject</button>
      <button class="btn btn-primary" data-action="approve">Approve</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script type="module" src="admin.js"></script>
</body>
</html>
